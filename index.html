<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeu de dées</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="diceContainer">
        <div class="die">
            <p id="playerOneDie">?</p>
        </div>
        <div class="die">
            <p id="playerTwoDie">?</p>
        </div>
    </div>
    <form id="gameStartForm" action="">
        <p>Nom joueur 1 : <input type="text" name="" id="playerOneName"></p>
        <p>Nombre de faces du dé du joueur 1 : <input type="number" min="2" max="100" id="playerOneDieFaceNumber"></p>
        <p>Nom joueur 2 : <input type="text" name="" id="playerTwoName"></p>
        <p>Nombre de faces du dé du joueur 2 : <input type="number" min="2" max="100" id="playerTwoDieFaceNumber"></p>
        <p>Nombre de tours : <input type="number" min="1" max="100" id="turnNumber"></p>
        <button id="gameStartButton">Lancer une partie</button>
    </form>
    <p id="gameResult"></p>
    <script src="script.js"></script>
</body>
</html>
